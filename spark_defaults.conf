# ---- Cluster ----
spark.master                        spark://spark-master:7077
spark.driver.host                   driver
spark.driver.bindAddress            0.0.0.0
spark.driver.port                   7078
spark.driver.blockManager.port      7079

# ---- Resources: sized for a fanless M4 Air ----
spark.driver.memory                 2g
spark.executor.memory               2g
spark.executor.cores                2
spark.cores.max                     4
spark.sql.shuffle.partitions        8

# ---- Python must match on driver and executors ----
spark.pyspark.python                /home/airflow/.venv/bin/python
spark.pyspark.driver.python         /home/airflow/.venv/bin/python

# ---- Iceberg ----
spark.sql.extensions                org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.catalog.local             org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.local.type        hadoop
spark.sql.catalog.local.warehouse   file:///home/airflow/warehouse
spark.sql.defaultCatalog            local
spark.sql.catalogImplementation     in-memory

# ---- History ----
spark.eventLog.enabled              true
spark.eventLog.dir                  file:///home/airflow/spark-events
spark.history.fs.logDirectory       file:///home/airflow/spark-events
